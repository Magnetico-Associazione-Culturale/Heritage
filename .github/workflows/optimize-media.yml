name: Ottimizza media

# A ogni push che aggiunge o modifica media: converte immagini in WebP e audio in AAC (.m4a),
# aggiorna i path nei JSON e in catalog.json, alza content_version e fa un commit automatico.
# I file già ottimizzati (registrati in <comune>/media/.optimized.json) non vengono ricompressi.
on:
  push:
    branches: [main]
    paths:
      - "Comune di */media/**"
      - "optimize_media.py"
  workflow_dispatch:

permissions:
  contents: write

# Stesso gruppo di "Genera percorsi itinerari": i due bot non committano mai in contemporanea.
concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa gli strumenti
        run: |
          pip install --quiet "pillow>=10" "pillow-heif>=0.16"
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Ottimizza i media
        run: python3 optimize_media.py

      - name: Valida il catalogo dei comuni
        run: python3 validate_catalog.py

      - name: Valida i contenuti
        run: |
          for dir in "Comune di "*/; do
            echo "== $dir"
            (cd "$dir" && python3 validate.py)
          done

      - name: Commit dei media ottimizzati
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessun cambiamento"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A "Comune di "*/ catalog.json
          git commit -m "Ottimizza media [automatico]"
          git pull --rebase
          git push
